name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Grant the permissions required to deploy to Page
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # REPLACE THIS STEP with your actual build command (e.g., npm run build)
      - name: Build site
        run: |
          mkdir _site
          echo "<h1>My Custom Site</h1>" > _site/index.html
      - name: Upload artifact
        uses: [actions/upload-pages-artifact](https://github.com/actions/upload-pages-artifact)@v3
        with:
          path: './_site' # The directory containing your static files

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: [actions/deploy-pages](https://github.com/actions/deploy-pages)@v4
